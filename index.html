function isImageFile(file){
  return !!file && (String(file.type || '').startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(file.name || ''));
}
function isTextFile(file){
  return !!file && (String(file.type || '').startsWith('text/') || /\.(txt|md|markdown|json|csv)$/i.test(file.name || ''));
}
function downscaleImage(file, maxSide=420){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片格式无法识别'));
      img.onload = () => {
        try {
          const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
          const scale = Math.min(1, maxSide / Math.max(iw, ih));
          const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#f4efe4';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        } catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function addLibrarySource(p, title, text){
  const src = {
    id: uid('src'),
    title: asText(title).trim() || ('资料 ' + new Date().toLocaleString('zh-CN', { hour12:false })),
    text: asText(text).slice(0, 200000),
    createdAt: nowISO(),
  };
  p.library.sources.unshift(src);
  if(p.library.sources.length > 40) p.library.sources.length = 40;
  touch();
  return src;
}
function splitLibraryText(text, max=4000){
  const clean = asText(text).replace(/\r\n/g, '\n').trim();
  if(clean.length <= max) return [clean];
  const parts = clean.split(/\n{2,}/);
  const chunks = [];
  let buf = '';
  const push = () => { if(buf.trim()) chunks.push(buf.trim()); buf = ''; };
  parts.forEach(part => {
    const p = part.trim();
    if(!p) return;
    if(p.length > max){
      push();
      for(let i=0;i<p.length;i+=max) chunks.push(p.slice(i, i + max));
      return;
    }
    if(buf && buf.length + 2 + p.length > max) push();
    buf = buf ? buf + '\n\n' + p : p;
  });
  push();
  if(chunks.length > 1){
    const merged = [];
    chunks.forEach(c => {
      if(c.length < 80 && merged.length) merged[merged.length - 1] += '\n\n' + c;
      else merged.push(c);
    });
    return merged;
  }
  return chunks.length ? chunks : [clean];
}
function mergeLibraryEntries(p, list, sourceId){
  let added = 0, merged = 0;
  asArray(list).slice(0, 100).forEach(raw => {
    const entry = ensureLibraryEntry(Object.assign({}, raw, { sourceId }));
    if(!entry) return;
    const same = p.library.entries.find(e =>
      e.type === entry.type &&
      (e.name === entry.name || (e.aliases || []).includes(entry.name) || entry.aliases.includes(e.name))
    );
    if(same){
      if(!same.summary && entry.summary) same.summary = entry.summary;
      if(!same.owner && entry.owner) same.owner = entry.owner;
      if(entry.details && !same.details.includes(entry.details)) same.details = (same.details ? same.details + '\n' : '') + entry.details;
      same.aliases = Array.from(new Set((same.aliases || []).concat(entry.aliases))).slice(0, 8);
      same.tags = Array.from(new Set((same.tags || []).concat(entry.tags))).slice(0, 10);
      same.updatedAt = nowISO();
      merged++;
    } else {
      if(p.library.entries.length >= 100) return;
      p.library.entries.push(entry);
      added++;
    }
  });
  return { added, merged };
}
function libExtract(){
  const p = proj();
  const title = document.getElementById('libTitle')?.value || '';
  const text = (document.getElementById('libText')?.value || '').trim();
  if(text.length < 10) return toast('请先粘贴至少 10 个字的资料内容', 'err');
  const analyzeText = truncate(text, 20000);
  const src = addLibrarySource(p, title, text);
  const demo = demoLibrary(p);
  const chunks = hasKey() ? splitLibraryText(analyzeText, 4000) : [analyzeText];
  const batch = { index:0, added:0, merged:0 };

  const peopleChunks = hasKey() ? splitLibraryText(analyzeText, 6000) : [analyzeText];
  const people = { index:0, added:0, merged:0, locked:0, world:[] };

  const finishPeople = () => {
    const box = document.getElementById('libText');
    if(box) box.value = '';
    touch(); syncChrome(); renderPage();
    const bits = [];
    if(people.added) bits.push(`人物 +${people.added} 个`);
    if(people.merged) bits.push(`人物补全 ${people.merged} 个`);
    if(people.locked) bits.push(`跳过锁定人物 ${people.locked} 个`);
    if(people.world.length) bits.push(`世界观已填：${Array.from(new Set(people.world)).join('、')}`);
    toast(bits.length ? '已同步：' + bits.join('；') : '没有可补充的人物/世界观，资料条目已保存', bits.length ? 'ok' : '', 5200);
  };

  const runPeopleBatch = () => {
    const multi = peopleChunks.length > 1;
    const chunk = peopleChunks[people.index];
    structuredGen({
      title: multi ? `识别资料 · 人物与世界观 ${people.index + 1}/${peopleChunks.length}` : '识别资料 · 同步人物与世界观',
      messages: buildLibraryPeopleMessages(p, chunk, src.title + (multi ? `（第 ${people.index + 1} 段）` : ''), 20),
      demoText: JSON.stringify({ characters:demo.characters, world:demo.world }, null, 2),
      truncatedHint: multi
        ? `第 ${people.index + 1} 段人物/世界观输出被截断：请点“重试”；若仍失败，请把这一段材料再拆小。`
        : '人物/世界观输出被截断：请点“重试”，或把材料拆成两份（一次识别一批人物）后分别投喂。',
      onParsed(data){
        if(!data || typeof data !== 'object' || Array.isArray(data)) return toast('人物/世界观结果格式不正确，条目已保存，可稍后重试', 'err');
        const charList = asArray(data.characters).slice();
        const seenChars = new Set(charList.map(c => asText(c && c.name).trim()).filter(Boolean));
        (p.library.entries || []).filter(e => e && e.type === 'character').forEach(e => {
          const nm = asText(e.name).trim();
          if(!nm || seenChars.has(nm)) return;
          seenChars.add(nm);
          charList.push({
            name: nm,
            role: normalizeCharacterRole(asList(e.tags).join(' ')),
            identity: asText(e.summary).trim(),
            relation: '',
          });
        });
        const chars = mergeExtractedCharacters(p, charList);
        people.added += chars.added;
        people.merged += chars.merged;
        people.locked += chars.locked;
        people.world.push(...applyWorldExtract(p, data.world));
        if(people.index < peopleChunks.length - 1){
          people.index++;
          toast(`人物/世界观第 ${people.index} 段已同步，继续下一段…`, 'ok', 2000);
          setTimeout(() => {
            if(ui.page === 'library') runPeopleBatch();
          }, 220);
          return;
        }
        finishPeople();
      },
    });
  };

  const syncPeople = () => runPeopleBatch();

  const finishEntries = () => {
    touch(); syncChrome(); renderPage();
    const titleEl = document.getElementById('libTitle');
    if(titleEl) titleEl.value = src.title;
    const box = document.getElementById('libText');
    if(box) box.value = text;
    toast(`条目已入库（新增 ${batch.added} / 补全 ${batch.merged}），正在同步人物与世界观…`, 'ok', 3600);
    setTimeout(() => {
      if(ui.page === 'library') syncPeople();
    }, 180);
  };

  const runBatch = () => {
    const chunk = chunks[batch.index];
    const multi = chunks.length > 1;
    const label = multi ? `识别资料 · 拆条目 ${batch.index + 1}/${chunks.length}` : '识别资料 · 拆条目';
    structuredGen({
      title: label,
      messages: buildLibraryEntriesMessages(p, chunk, src.title + (multi ? `（第 ${batch.index + 1} 段）` : ''), 30),
      demoText: JSON.stringify({ sourceSummary:demo.sourceSummary, entries:demo.entries }, null, 2),
      truncatedHint: multi
        ? `第 ${batch.index + 1} 段条目输出被截断：请点“重试”；若仍失败，请把这一段材料再拆小。`
        : '资料条目输出被截断：请点“重试”，或把文件拆小后分批投喂。',
      onParsed(data){
        if(!data || typeof data !== 'object' || Array.isArray(data)) return toast('识别结果格式不正确，原文已保存，可重试或手动添加', 'err');
        const list = asArray(data.entries);
        if(!list.length) return toast('这一段没有识别出条目，原文已保存；可重试，或把材料拆小后重试', 'err');
        const { added, merged } = mergeLibraryEntries(p, list, src.id);
        batch.added += added;
        batch.merged += merged;
        if(!src.summary && data.sourceSummary) src.summary = asText(data.sourceSummary).trim();
        if(batch.index < chunks.length - 1){
          batch.index++;
          toast(`第 ${batch.index} 段已入库，继续识别第 ${batch.index + 1} 段…`, 'ok', 2000);
          setTimeout(() => {
            if(ui.page === 'library') runBatch();
          }, 220);
          return;
        }
        finishEntries();
      },
    });
  };

  if(chunks.length > 1) toast(`材料较长，自动分 ${chunks.length} 段识别，避免输出被截断`, 'ok', 2800);
  runBatch();
}

async function handleLibraryFile(file){
  if(!file) return;
  const name = (file.name || '').toLowerCase();
  const ok = /\.(txt|md|markdown|json|csv)$/.test(name) || /^text\//.test(file.type) || file.type === 'application/json';
  if(!ok) return toast('资料库目前支持 txt / md / json / csv 文本文件；图片请到人物页用「形象注入」', 'err');
  try {
    const text = (await file.text()).replace(/^\uFEFF/, '');
    if(!text.trim()) return toast('文件是空的', 'err');
    if(text.length > 200000) return toast('文件太大（超过 20 万字符），请拆分后再投喂', 'err');
    const t = document.getElementById('libTitle');
    if(t && !t.value.trim()) t.value = file.name.replace(/\.[^.]+$/, '');
    const box = document.getElementById('libText');
    if(box) box.value = text;
    if(hasKey()){
      toast(`已读入「${file.name}」，正在自动识别并同步人物/世界观…`, 'ok');
      setTimeout(() => {
        if(ui.page === 'library' && document.getElementById('libText')?.value.trim()) libExtract();
      }, 120);
    } else {
      toast(`已读入「${file.name}」，点「识别并入库」查看演示抽取`, 'ok');
    }
  } catch(err){
    toast('读取文件失败：' + (err.message || err), 'err');
  }
}

function filterLibrary(){

  const type = document.getElementById('libTypeFilter')?.value || '';
  ui.libQuery = q; ui.libType = type;
  let shown = 0;
  document.querySelectorAll('#libList [data-lib-char]').forEach(card => {
    const okQ = !q || (card.dataset.search || '').includes(q);
    const types = (card.dataset.types || '').split(',');
    const okT = !type || types.includes(type);
    card.hidden = !(okQ && okT);
    if(okQ && okT) shown += Number(card.dataset.entryCount || 0);
  });
  document.querySelectorAll('#libList [data-lib-entry]').forEach(card => {
    const okQ = !q || (card.dataset.search || '').includes(q);
    const okT = !type || card.dataset.type === type;
    card.hidden = !(okQ && okT);
    if(okQ && okT) shown++;
  });
  document.querySelectorAll('#libList [data-lib-group]').forEach(group => {
    const visible = Array.from(group.querySelectorAll('[data-lib-entry]')).filter(card => !card.hidden);
    group.hidden = !visible.length;
    const counts = {};
    visible.forEach(card => { counts[card.dataset.type] = (counts[card.dataset.type] || 0) + 1; });
    const label = group.querySelector('.lib-unowned-head span');
    if(label) label.textContent = LIB_TYPES.filter(t => counts[t.key]).map(t => `${t.label} ${counts[t.key]}`).join(' · ');
  });
  const count = document.getElementById('libCount');
  if(count) count.textContent = `${shown} / ${proj().library.entries.length} 条设定`;
}

function applyOutline(p, data){
  data = (data && typeof data === 'object') ? data : {};
  const oldMap = new Map(allChapters().map(x => [x.ch.title, x.ch]));
  const volumes = asArray(data.volumes).filter(v => v && Array.isArray(v.chapters) && v.chapters.length).slice(0, 8);
  if(!volumes.length) return toast('模型没有返回可用的分卷，请重试', 'err');
  p.outline.logline = asText(data.logline || p.outline.logline).trim();
  p.outline.mainline = asText(data.mainline || p.outline.mainline).trim();
  p.outline.volumes = volumes.map((v, vi) => ({
    id: uid('v'),
    title: asText(v.title || `第${vi+1}卷`).trim(),
    summary: asText(v.summary).trim(),
    chapters: v.chapters.filter(ch => ch && asText(ch.title).trim()).slice(0, 12).map(ch => {
      const title = asText(ch.title).trim();
      const old = oldMap.get(title);
      return {
        id: uid('ch'),
        title,
        outline: asText(ch.outline).trim(),
        content: old ? old.content : '',
        styleId: old ? old.styleId : '',
        wordTarget: old ? (Number(old.wordTarget) || 0) : 0,
        titleLength: old ? (Number(old.titleLength) || 0) : 0,
      };
    }),
  }));
  ui.currentChapterId = null;
  touch(); syncChrome(); renderPage();
  toast('大纲已生成，可逐卷补充或手动调整', 'ok');
}

async function installApp(){
  if(isStandalone()){ toast('已经以 App 模式打开', 'ok'); return; }
  if(deferredInstallPrompt){
    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    const btn = document.getElementById('installBtn');
    if(btn) btn.hidden = true;
    try {
      promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      toast(choice && choice.outcome === 'accepted' ? '已提交安装，请按浏览器提示完成' : '已取消安装', choice && choice.outcome === 'accepted' ? 'ok' : '');
    } catch(err){
      if(btn) btn.hidden = false;
      pwaHelpModal();
    }
    return;
  }
  pwaHelpModal();
}
function setupPWA(){
  const btn = document.getElementById('installBtn');
  if(isStandalone() && btn) btn.hidden = true;
  if(isIOS() && !isStandalone() && btn) btn.hidden = false;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if(btn) btn.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if(btn) btn.hidden = true;
    toast('已安装到主屏幕', 'ok');
  });

  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if('serviceWorker' in navigator && (location.protocol === 'https:' || local)){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker 注册失败：', err));
    });
  }
}

async function handleImportFile(file){
  if(!file) return;
  try {
    const text = (await file.text()).replace(/^\uFEFF/, '');
    const data = JSON.parse(text);
    const raw = data && data.project ? data.project : data;
    if(!raw || typeof raw !== 'object' || (!raw.world && !raw.outline && !raw.characters)) throw new Error('结构不符');
    const p = ensureShape(JSON.parse(JSON.stringify(raw)));
    if(!p) throw new Error('结构不符');
    p.id = uid('p');
    const exists = store.projects.some(x => x.name === p.name);
    if(exists) p.name = p.name + '（导入）';
    if(Array.isArray(data.customStyles)){
      data.customStyles.forEach(s => {
        const st = ensureCustomStyle(s);
        if(st && !store.customStyles.some(x => x.id === st.id)) store.customStyles.push(st);
      });
    }
    store.projects.push(p);
    store.currentId = p.id;
    ui.currentChapterId = null;
    persist(true); syncChrome(); go('world');
    toast(`已导入「${p.name}」，共 ${p.characters.length} 个人物`, 'ok');
  } catch(e){
    console.error(e);
    toast('导入失败：请选择由本工具导出的项目 JSON', 'err', 4800);
  }
}

    const p = proj();
    p.genre = el.value;
    touch(); syncChrome();
  },
  'gen-chars': () => genCharacters(),
  'add-char': () => {
    const p = proj();
    p.characters.push(newCharacter());
    touch(); syncChrome(); renderPage();
    window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
  },
  'regen-char': el => regenCharacter(el.dataset.cid),
  'inject-char': el => openCharacterInject(el.dataset.cid || null),
  'inject-analyze': () => analyzeCharacterImport(),
  'del-char': el => deleteCharacter(el.dataset.cid),
  'lock-char': el => {
    const c = proj().characters.find(x => x.id === el.dataset.cid);
    if(!c) return;
    c.locked = !c.locked;
    persist(true); renderPage();
    toast(c.locked ? '角色已锁定' : '角色已解锁');
  },
  'gen-outline': el => genOutline(el.dataset.mode || 'book'),
  'direct-write': () => directWriteChapter(),
  'retitle-chapter': () => retitleCurrentChapter(),
  'add-library': () => openLibraryEntry(''),
  'lib-add': () => openLibraryEntry(''),
  'lib-edit': el => openLibraryEntry(el.dataset.lid),
  'lib-del': el => deleteLibraryEntry(el.dataset.lid),
  'lib-del-source': el => deleteLibrarySource(el.dataset.sid),
  'lib-strict': () => toggleLibraryStrict(),

  'lib-extract': () => libExtract(),
  'lib-save-source': () => libSaveSource(),
  'lib-pick-file': () => libPickFile(),
  'lib-entry-save': () => saveLibraryEntry(),
  'expand-volume': el => expandVolume(el.dataset.vid),
  'add-volume': () => {
    const p = proj();
    p.outline.volumes.push({ id:uid('v'), title:`第${p.outline.volumes.length+1}卷`, summary:'', chapters:[] });
    touch(); renderPage();
  },
  'del-volume': el => {
    const p = proj(), v = findVolume(el.dataset.vid);
    if(!v) return;
    confirmDialog('删除本卷？', `将删除「${v.title}」及其 ${v.chapters.length} 个章节（含已写正文）。`, () => {
      p.outline.volumes = p.outline.volumes.filter(x => x.id !== v.id);
      touch(); renderPage(); toast('已删除本卷');
    }, '删除');
  },
  'add-chapter': el => {
    const v = findVolume(el.dataset.vid);
    if(!v) return;
    v.chapters.push({ id:uid('ch'), title:`第${v.chapters.length+1}章`, outline:'', content:'', styleId:'', wordTarget:0, titleLength:0 });
    touch(); renderPage();
  },
  'del-chapter': el => {
    const found = findChapter(el.dataset.chid);
    if(!found) return;
    const { volume, chapter } = found;
    confirmDialog('删除本章？', `将删除「${chapter.title}」${countChars(chapter.content) ? '及其正文' : ''}。`, () => {
      volume.chapters = volume.chapters.filter(c => c.id !== chapter.id);
      if(ui.currentChapterId === chapter.id) ui.currentChapterId = null;
      touch(); renderPage(); toast('已删除章节');
    }, '删除');
  },
  'write-chapter': el => {
    ui.currentChapterId = el.dataset.chid;
    go('writing');
  },
  'select-chapter': el => {
    if(ui.busy) return toast('正在生成中，请稍候', 'err');
    ui.currentChapterId = el.dataset.chid;
    renderPage();
  },
  'gen-chapter': () => proseTask('gen'),
  'continue-chapter': () => proseTask('continue'),
  'polish-chapter': () => proseTask('polish'),
  'restyle-chapter': () => proseTask('restyle'),
  'set-chapter-style': el => {
    const found = findChapter(ui.currentChapterId);
    if(!found) return;
    found.chapter.styleId = el.value;
    touch(); renderPage();
    toast('本章文风：' + chapterStyle(found.chapter).name);
  },
  'set-writing-strength': el => {
    const p = proj();
    p.styleStrength = el.dataset.strength;
    touch(); renderPage();
  },
  'set-style-strength': el => {
    const p = proj();
    p.styleStrength = el.dataset.strength;
    touch(); renderPage();
  },
  'copy-chapter': () => {
    const found = findChapter(ui.currentChapterId);
    if(!found || !found.chapter.content.trim()) return toast('本章还没有内容', 'err');
    copyText(found.chapter.content).then(ok => toast(ok ? '正文已复制' : '复制失败，请手动选择复制', ok ? 'ok' : 'err'));
  },
  'clear-chapter': () => {
    const found = findChapter(ui.currentChapterId);
    if(!found || !found.chapter.content) return;
    confirmDialog('清空本章正文？', '只清空正文，章节标题与细纲保留。', () => {
      found.chapter.content = '';
      touch(); renderPage(); toast('已清空本章正文');
    }, '清空');
  },
  'open-style': el => openStyleDetail(el.dataset.sid),
  'use-style': el => useStyle(el.dataset.sid),
  'new-custom-style': () => newCustomStyleModal(),
  'del-style': el => deleteStyle(el.dataset.sid),
  'export-md': () => exportMarkdown(),
  'export-json': () => exportProjectJSON(),
  'copy-md': () => {
    copyText(buildMarkdown(proj())).then(ok => toast(ok ? '完整 Markdown 已复制到剪贴板' : '复制失败，请改用下载', ok ? 'ok' : 'err'));
  },
  'import-json': () => importProjectJSON(),
  'del-project': () => deleteProject(),
  'test-api': el => testConnection(el),
  'save-settings': () => saveSettings(),
  'stop-prose': el => {
    if(ui.gen && ui.gen.controller){
      try { ui.gen.controller.abort(); } catch(e){}
      el.disabled = true; el.textContent = '停止中…';
    }
  },
  'stop-gen': el => {
    if(ui.gen && ui.gen.controller){
      try { ui.gen.controller.abort(); } catch(e){}
      el.disabled = true; el.textContent = '正在停止…';
    }
  },
  'retry-gen': () => {
    if(ui.gen && typeof ui.gen.retry === 'function') ui.gen.retry();
  },
};

/* ============================================================
   事件绑定与启动
   ============================================================ */
function init(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.tagName === 'SELECT') return;
    const act = el.dataset.action;
    if(act === 'confirm-yes' || act === 'apply-prose') return;
    const fn = ACTIONS[act];
    if(!fn) return;
    try {
      const r = fn(el, e);
      if(r && typeof r.catch === 'function') r.catch(err => { console.error(err); toast(friendlyError(err), 'err', 5000); });
    } catch(err){
      console.error(err);
      toast(friendlyError(err), 'err', 5000);
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if(el.id === 'libFile'){
      handleLibraryFile(el.files && el.files[0]);
      el.value = '';
      return;
    }
    if(el.id === 'libTypeFilter'){
      filterLibrary();
      return;
    }
    if(el.id === 'projectSelect'){
      if(ui.busy) { toast('正在生成中，请稍候', 'err'); el.value = proj().id; return; }
      store.currentId = el.value;
      ui.currentChapterId = null;
      persist(true); syncChrome(); renderPage();
      return;
    }
    if(el.id === 'wordTarget'){
      const found = findChapter(ui.currentChapterId);
      if(found){
        const n = parseInt(el.value, 10);
        found.chapter.wordTarget = (Number.isFinite(n) && n > 0) ? clamp(n, 500, 6000) : 0;
        el.value = found.chapter.wordTarget || '';
        touch(); updateWordCount();
      }
      return;
    }
    if(el.id === 'titleLength'){
      const found = findChapter(ui.currentChapterId);
      if(found){
        const n = parseInt(el.value, 10);
        found.chapter.titleLength = Number.isFinite(n) && n >= 1 ? clamp(n, 1, 24) : 0;
        touch();
      }
      return;
    }
    if(el.matches('[data-char-field="role"]')){
      const card = el.closest('[data-cid]');
      const c = proj().characters.find(x => x.id === card?.dataset.cid);
      if(c){ c.role = el.value; touch(); }
      return;
    }
    const act = el.dataset.action;
    if(act === 'set-genre' || act === 'set-chapter-style'){
      const fn = ACTIONS[act];
      if(fn){ try { fn(el, e); } catch(err){ console.error(err); toast(friendlyError(err), 'err'); } }
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    const p = proj();

    if(el.id === 'libSearch'){
      filterLibrary();
      return;
    }
    if(el.id === 'wordTarget'){
      const found = findChapter(ui.currentChapterId);
      if(found){
        const n = parseInt(el.value, 10);
        found.chapter.wordTarget = (Number.isFinite(n) && n > 0) ? clamp(n, 500, 6000) : 0;
        touch(); updateWordCount();
      }
      return;
    }
    if(el.id === 'chapterContent'){
      const found = findChapter(ui.currentChapterId);
      if(found){ found.chapter.content = el.value; touch(); updateWordCount(); }
      return;
    }
    if(el.matches('[data-char-field]')){
      const card = el.closest('[data-cid]');
      const c = p.characters.find(x => x.id === card?.dataset.cid);
      if(c && el.dataset.charField !== 'role'){
        c[el.dataset.charField] = el.value;
        if(el.dataset.charField === 'name') syncChrome();
        touch();
      }
      if(el.tagName === 'TEXTAREA') autoGrow(el);
      return;
    }
    if(el.matches('[data-ch-field]')){
      const row = el.closest('.chapter-row');
      const found = findChapter(row?.dataset.chid);
      if(found){ found.chapter[el.dataset.chField] = el.value; touch(); }
      if(el.tagName === 'TEXTAREA') autoGrow(el);
      return;
    }
    if(el.matches('[data-v-field]')){
      const card = el.closest('.volume-card');
      const v = findVolume(card?.dataset.vid);
      if(v){ v[el.dataset.vField] = el.value; touch(); }
      if(el.tagName === 'TEXTAREA') autoGrow(el);
      return;
    }
    if(el.matches('[data-chapter-title]')){
      const found = findChapter(ui.currentChapterId);
      if(found){ found.chapter.title = el.value; touch(); }
      return;
    }
    if(el.matches('[data-bind]')){
      setPath(p, el.dataset.bind, el.value);
      if(el.dataset.bind === 'name'){
        p.world.title = el.value;
        const pm = document.querySelector('#projectMeta .pm-name');
        if(pm) pm.textContent = el.value || '未命名作品';
        const opt = document.querySelector(`#projectSelect option[value="${p.id}"]`);
        if(opt) opt.textContent = el.value || '未命名作品';
      }
      touch();
      if(el.tagName === 'TEXTAREA') autoGrow(el);
    }
  });

  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      persist(true);
      toast('已保存到本机');
      return;
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && (e.target.id === 'directTitle' || e.target.id === 'directOutline')){
      e.preventDefault();
      directWriteChapter();
      return;
    }
    if(e.key === 'Escape'){
      const root = document.getElementById('modalRoot');
      if(root && !root.hidden){
        if(ui.gen && ui.gen.controller){ try { ui.gen.controller.abort(); } catch(err){} }
        closeModal();
      }
    }
  });

  const fileInput = document.getElementById('importFile');
  if(fileInput) fileInput.addEventListener('change', () => {
    handleImportFile(fileInput.files && fileInput.files[0]);
    fileInput.value = '';
  });

  window.addEventListener('pagehide', () => persist(true));
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') persist(true); });

  syncChrome();
  renderPage();
  setupPWA();
  maybeShowMobileGuide();
}
init();

</script>
</body>
</html>
