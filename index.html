<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨引 · 小说 AI 工坊</title>
<meta name="theme-color" content="#24211b">
<meta name="application-name" content="墨引">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="墨引">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --paper:#f4efe4;
  --paper-2:#efe8d9;
  --panel:#fffdf7;
  --panel-2:#faf6ec;
  --ink:#24211b;
  --ink-2:#3d382f;
  --muted:#7c7364;
  --faint:#a79d8b;
  --line:#e2d9c6;
  --line-strong:#cfc2a9;
  --accent:#a63c2b;
  --accent-soft:#f3e2dc;
  --jade:#2f5d50;
  --jade-soft:#e2ece7;
  --gold:#a9853d;
  --shadow:0 1px 2px rgba(60,48,30,.06),0 10px 30px rgba(60,48,30,.07);
  --radius:14px;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 500px at 85% -10%,rgba(166,60,43,.06),transparent 60%),
    radial-gradient(900px 420px at -10% 110%,rgba(47,93,80,.07),transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:rgba(166,60,43,.18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d8cdb8;border-radius:8px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  height:62px;padding:0 22px;
  background:rgba(250,246,236,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:9px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#2c2922,#4a4336);
  color:#f6efe1;font-family:var(--serif);font-size:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(40,32,20,.25);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-family:var(--serif);font-size:17px;letter-spacing:.14em}
.brand-text span{font-size:10.5px;color:var(--muted);letter-spacing:.28em}
.top-actions{display:flex;align-items:center;gap:9px}
.shell{display:flex;min-height:calc(100vh - 62px)}
.sidebar{
  width:226px;flex:none;
  padding:22px 14px 26px;
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;
  position:sticky;top:62px;height:calc(100vh - 62px);
  overflow-y:auto;
}
.project-meta{padding:0 8px}
.project-meta .pm-label{font-size:10.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
.project-meta .pm-name{font-family:var(--serif);font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-meta .pm-genre{font-size:11.5px;color:var(--muted);margin-top:2px}
.steps{display:flex;flex-direction:column;gap:3px}
.step-btn{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 11px;border:0;border-radius:10px;background:transparent;
  color:var(--ink-2);text-align:left;transition:background .16s,color .16s;
}
.step-btn:hover{background:rgba(60,48,30,.055)}
.step-btn.active{background:var(--ink);color:#f7f1e4;box-shadow:0 6px 14px rgba(40,32,20,.18)}
.step-num{
  width:22px;height:22px;flex:none;border-radius:50%;
  display:grid;place-items:center;font-size:11px;font-weight:600;
  border:1px solid var(--line-strong);color:var(--muted);background:var(--panel);
}
.step-btn.active .step-num{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#f7f1e4}
.step-label{font-size:13.5px;letter-spacing:.06em}
.step-done .step-num{background:var(--jade-soft);border-color:#b9cfc5;color:var(--jade)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.side-link{
  border:0;background:transparent;text-align:left;padding:8px;border-radius:8px;
  color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;
}
.side-link:hover{background:rgba(60,48,30,.05);color:var(--ink)}
.main{flex:1;min-width:0;padding:34px 44px 90px;max-width:1280px}
.page{max-width:1080px;margin:0 auto;animation:pageIn .28s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- typography / generic ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.step-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;
  margin-bottom:7px;
}
.step-chip::before{content:"";width:18px;height:1px;background:var(--accent)}
h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;letter-spacing:.06em}
.page-sub{color:var(--muted);font-size:13px;margin-top:6px;max-width:640px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{padding:18px 20px}
.section-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.section-title small{font-family:var(--sans);font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.06em}
.hr{height:1px;background:var(--line);border:0;margin:18px 0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:9px;font-size:13px;line-height:1.2;
  transition:transform .12s,box-shadow .16s,background .16s,border-color .16s;
}
.btn:hover{border-color:#b9aa8d;box-shadow:0 3px 10px rgba(60,48,30,.09)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#f8f3e7}
.btn.primary:hover{background:#353128}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:#933425}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(60,48,30,.06);color:var(--ink);box-shadow:none}
.btn.small{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.tiny{padding:3px 8px;font-size:11px;border-radius:6px;gap:4px}
.btn.block{width:100%}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;flex:none;
  border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:16px;
}
.icon-btn:hover{background:rgba(60,48,30,.07);color:var(--ink)}
.btn .spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
#genHint .spin,.gen-status .spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field > label,.label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.05em}
.input,.select,.textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;outline:none;transition:border-color .16s,box-shadow .16s;
}
.input:focus,.select:focus,.textarea:focus{border-color:#b9a173;box-shadow:0 0 0 3px rgba(169,133,61,.13)}
.textarea{resize:vertical;min-height:80px;line-height:1.75}
.input::placeholder,.textarea::placeholder{color:#b3a894}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.input-row{display:flex;gap:10px;align-items:center}
.range{width:100%;accent-color:var(--accent)}
.hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.6}
.auto-grow{overflow:hidden}

/* ---------- topbar controls ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;
  font-size:11px;letter-spacing:.06em;border:1px solid transparent;white-space:nowrap;cursor:pointer;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.demo{background:#f5ead2;color:#8a6520;border-color:#e8d6ac}
.badge.live{background:var(--jade-soft);color:var(--jade);border-color:#bcd2c7}
.project-select{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 28px 7px 11px;max-width:220px;font-size:12.5px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.np-icon{display:none}
.install-btn{gap:4px}
.install-btn span[aria-hidden]{font-size:15px;line-height:1}

/* ---------- inspiration / world ---------- */
.idea-card{background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);position:relative;overflow:hidden}
.idea-card::after{
  content:"墨";position:absolute;right:18px;bottom:-26px;font-family:var(--serif);
  font-size:120px;line-height:1;color:rgba(60,48,30,.045);pointer-events:none;
}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.world-card{padding:16px 17px;display:flex;flex-direction:column;gap:9px;position:relative}
.world-card.wide{grid-column:1/-1}
.world-card-head{display:flex;align-items:center;gap:6px}
.world-card-head .wt{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.04em}
.world-card-head .ws{font-size:10.5px;color:var(--faint);letter-spacing:.1em}
.world-card .textarea{min-height:88px;background:transparent;border-color:transparent;padding:6px 2px;line-height:1.85;font-family:var(--serif);font-size:13.5px}
.world-card .textarea:hover{border-color:var(--line);background:var(--panel)}
.world-card .textarea:focus{border-color:#b9a173;background:var(--panel);padding:8px 10px}
.world-card.locked{background:var(--panel-2)}
.lock-btn{
  width:26px;height:26px;border:1px solid transparent;border-radius:6px;background:transparent;
  display:grid;place-items:center;color:var(--faint);font-size:13px;flex:none;
}
.lock-btn:hover{background:rgba(60,48,30,.06);color:var(--ink)}
.lock-btn.on{color:var(--gold);background:#f7efdc;border-color:#eadcbc}

/* ---------- characters ---------- */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:16px}
.char-card{padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.char-head{display:flex;align-items:center;gap:8px}
.char-name{font-family:var(--serif);font-size:16px;font-weight:600;border:0;background:transparent;padding:2px 0;flex:1;min-width:0}
.char-name:focus{outline:none;border-bottom:1px dashed var(--line-strong)}
.char-role{width:auto;font-size:11px;padding:3px 22px 3px 8px;border-radius:20px;background:var(--jade-soft);border-color:transparent;color:var(--jade)}
.char-body{display:flex;flex-direction:column;gap:7px}
.char-field{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.char-field .cf-label{font-size:11.5px;color:var(--faint);padding-top:5px;letter-spacing:.04em}
.char-field .textarea{min-height:0;padding:4px 7px;font-size:12.5px;line-height:1.7;border-color:transparent;background:transparent;resize:vertical}
.char-field .textarea:hover{border-color:var(--line);background:var(--panel-2)}
.char-field .textarea:focus{border-color:#b9a173;background:var(--panel)}
.char-foot{display:flex;align-items:center;gap:6px;margin-top:2px}
.add-char-card{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:transparent;
  min-height:120px;display:grid;place-items:center;color:var(--muted);font-size:13px;
}
.add-char-card:hover{background:rgba(255,253,247,.7);border-color:#b9a173;color:var(--ink)}

/* ---------- outline ---------- */
.outline-main{padding:18px 20px}
.volume-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.volume-card{padding:16px 18px;min-width:0}
.volume-summary{
  display:block;width:100%;min-width:0;box-sizing:border-box;
  white-space:pre-wrap;word-break:break-word;writing-mode:horizontal-tb;text-orientation:mixed;
}
.volume-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.volume-summary-label{font-size:11px;color:var(--faint);letter-spacing:.08em;margin:8px 0 4px}
.volume-index{
  width:28px;height:28px;border-radius:8px;background:var(--ink);color:#f6efe1;
  display:grid;place-items:center;font-family:var(--serif);font-size:13px;flex:none;
}
.volume-title{flex:1;min-width:160px;border:0;background:transparent;font-family:var(--serif);font-size:16px;font-weight:600;padding:4px 2px}
.volume-title:focus{outline:none;border-bottom:1px dashed var(--line-strong)}
.volume-summary{
  display:block!important;width:100%!important;box-sizing:border-box;
  min-height:56px;background:var(--panel-2);border-color:var(--line);border-radius:8px;
  padding:8px 10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.75;
  writing-mode:horizontal-tb!important;text-orientation:mixed!important;direction:ltr;
}
.volume-summary:hover{border-color:var(--line);background:var(--panel-2)}
.volume-summary:focus{border-color:#b9a173;background:var(--panel);padding:8px 10px}
.chapter-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chapter-row{
  display:grid;grid-template-columns:34px minmax(90px,210px) 1fr auto;gap:10px;align-items:start;
  padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
}
.chapter-row:hover{border-color:#d6c8ab}
.chapter-no{font-family:var(--serif);color:var(--faint);font-size:12px;padding-top:6px;text-align:right}
.chapter-row .input{border-color:transparent;background:transparent;padding:5px 6px;font-size:13px}
.chapter-row .input:hover,.chapter-row .textarea:hover{border-color:var(--line);background:var(--panel)}
.chapter-row .textarea{min-height:0;border-color:transparent;background:transparent;padding:5px 6px;font-size:12.5px;line-height:1.7;resize:vertical}
.chapter-row .textarea:focus,.chapter-row .input:focus{border-color:#b9a173;background:var(--panel)}
.chapter-actions{display:flex;gap:4px;align-items:center;padding-top:2px}

/* ---------- writing ---------- */
.write-layout{display:grid;grid-template-columns:252px minmax(0,1fr);gap:16px;align-items:start}
.chapter-nav{padding:12px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.chapter-nav .cn-group{font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin:12px 6px 5px}
.chapter-nav .cn-item{
  display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;
  padding:7px 9px;font-size:12.5px;color:var(--ink-2);line-height:1.5;
}
.chapter-nav .cn-item:hover{background:rgba(60,48,30,.055)}
.chapter-nav .cn-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chapter-nav .cn-item .cn-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--jade);margin-right:6px;vertical-align:1px}
.chapter-nav .cn-item .cn-dot.empty{background:var(--line-strong)}
.editor-card{overflow:hidden}
.editor-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.editor-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.editor-title{font-family:var(--serif);font-size:19px;font-weight:600;flex:1;min-width:180px;border:0;background:transparent;padding:2px 0}
.editor-title:focus{outline:none;border-bottom:1px dashed var(--line-strong)}
.word-count{font-size:11.5px;color:var(--faint);white-space:nowrap}
.editor-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.editor-body{padding:8px 26px 26px}
#chapterContent{
  width:100%;min-height:56vh;border:0;background:transparent;resize:vertical;
  font-family:var(--serif);font-size:15.5px;line-height:2.05;letter-spacing:.02em;outline:none;
  padding:18px 0;
}
#chapterContent::placeholder{color:#b7ab95}
.outline-ref{
  margin:10px 20px 0;padding:11px 14px;border-left:2px solid var(--gold);
  background:#faf4e6;border-radius:0 8px 8px 0;font-size:12px;color:var(--ink-2);
  max-height:120px;overflow:auto;line-height:1.75;
}
.outline-ref b{color:var(--gold);font-weight:600}
.direct-card{margin-bottom:16px;padding:16px 18px;border-color:#d8c8aa;background:linear-gradient(180deg,#fbf6ea,#f7f0e1)}
.direct-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}
.direct-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.direct-head .hint{max-width:620px;margin-top:3px}
.direct-fields{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(110px,.42fr) minmax(110px,.42fr);gap:10px}
.direct-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.direct-field.wide{grid-column:1/-1}
.direct-field>span{font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.direct-field .input,.direct-field .textarea{background:rgba(255,255,255,.52)}
.direct-field .textarea{min-height:86px;font-size:13px;line-height:1.75;resize:vertical}
.direct-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px;flex-wrap:wrap}
.direct-foot .hint{max-width:560px}
@media (max-width:840px){.direct-fields{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 9px;font-size:11.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#f7f1e4}
.seg button + button{border-left:1px solid var(--line)}

/* ---------- styles library ---------- */
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px;margin-top:16px}
.style-card{padding:17px 18px;display:flex;flex-direction:column;gap:8px;transition:transform .16s,box-shadow .16s,border-color .16s}
.style-card:hover{transform:translateY(-2px);border-color:#d3c3a2;box-shadow:0 8px 24px rgba(60,48,30,.1)}
.style-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,60,43,.1)}
.style-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.style-name{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em}
.style-mark{width:34px;height:34px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:17px;color:var(--accent);flex:none}
.style-tag{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--jade-soft);color:var(--jade);white-space:nowrap}
.style-desc{font-size:12px;color:var(--muted);line-height:1.7;min-height:40px}
.style-traits{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.trait{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.style-foot{display:flex;align-items:center;gap:7px;margin-top:4px}
.custom-badge{font-size:10px;color:var(--gold);border:1px solid #e3cf9f;background:#fbf5e2;border-radius:5px;padding:1px 6px}

/* ---------- export ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{padding:15px 17px}
.stat .sv{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.2}
.stat .sl{font-size:11px;color:var(--faint);letter-spacing:.12em;margin-top:3px}
.export-card{padding:18px 20px}
.md-preview{
  margin-top:12px;background:#2c2922;color:#e9e2d2;border-radius:10px;padding:16px 18px;
  font-family:var(--serif);font-size:12.5px;line-height:1.9;max-height:320px;overflow:auto;white-space:pre-wrap;
}

/* ---------- empty state ---------- */
.empty{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:42px 24px;
  text-align:center;color:var(--muted);background:rgba(255,253,247,.45);
}
.empty .em-title{font-family:var(--serif);font-size:16px;color:var(--ink-2);margin-bottom:5px}
.empty .em-sub{font-size:12px;max-width:420px;margin:0 auto 14px}

/* ---------- toast / modal ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{
  background:#2c2922;color:#f4edde;border-radius:10px;padding:10px 14px;font-size:12.5px;
  box-shadow:0 10px 30px rgba(20,15,8,.3);animation:toastIn .22s ease;display:flex;gap:8px;align-items:flex-start;
}
.toast.err{background:#7d2b20}
.toast.ok{background:#2f5d50}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-root{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.modal-root[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(32,26,18,.46);backdrop-filter:blur(3px)}
.modal{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(30,22,12,.35);animation:modalIn .22s ease;
}
.modal.wide{width:min(860px,100%)}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:17px 20px 13px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--serif);font-size:17px;margin:0;font-weight:600;letter-spacing:.04em;flex:1}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--panel-2);border-radius:0 0 16px 16px}
.gen-stream{
  background:#26231d;color:#ece5d6;border-radius:10px;padding:14px 16px;
  font-family:var(--serif);font-size:12.5px;line-height:1.85;
  height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;
}
.gen-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.gen-status .dot{width:7px;height:7px;border-radius:50%;background:var(--jade);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.key-input-wrap{position:relative}
.key-input-wrap .icon-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.profile-table{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.profile-row{display:grid;grid-template-columns:88px 1fr;border-top:1px solid var(--line)}
.profile-row:first-child{border-top:0}
.profile-row .pk{background:var(--panel-2);padding:9px 12px;font-size:12px;color:var(--muted)}
.profile-row .pv{padding:9px 12px;font-size:12.5px;line-height:1.75}
.sample-box{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:15px 17px;
  font-family:var(--serif);font-size:13.5px;line-height:2;color:var(--ink-2);white-space:pre-wrap;
}

/* ---------- 人物形象注入 ---------- */
.char-ava{width:42px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;background:var(--panel-2)}
.inject-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.inject-drop{
  position:relative;min-height:218px;border:1.5px dashed var(--line-strong);border-radius:12px;
  background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;text-align:center;cursor:pointer;overflow:hidden;transition:border-color .15s,background .15s;
}
.inject-drop:hover,.inject-drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.inject-drop .inj-plus{font-family:var(--serif);font-size:30px;line-height:1;color:var(--accent)}
.inject-drop .inj-tip{font-size:12.5px;color:var(--muted);line-height:1.7}
.inject-drop .inj-sub{font-size:11px;color:var(--faint);line-height:1.6}
.inject-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1d1a15}
.inject-drop.has-img{border-style:solid}
.inject-drop.has-img .inj-plus,.inject-drop.has-img .inj-tip,.inject-drop.has-img .inj-sub{display:none}
.inject-preview-text{font-size:12px;color:var(--muted);line-height:1.7;max-height:74px;overflow:auto;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.inject-status{min-height:20px}

/* ---------- 人物资料库 ---------- */
.lib-layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.lib-input-card{position:sticky;top:16px}
.lib-sources{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:150px;overflow:auto}
.lib-source{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.lib-source .spacer{flex:1}
.lib-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lib-toolbar .input{min-width:180px;flex:1}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lib-groups{display:flex;flex-direction:column;gap:16px}
.lib-group{min-width:0}
.lib-group[hidden]{display:none}
.lib-group-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:0 2px 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.lib-group-name{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.lib-group-count{font-size:11px;color:var(--faint)}
.lib-group-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.lib-owner{font-size:11px;color:var(--faint)}
.lib-entry{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.lib-entry[hidden]{display:none}
.lib-entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lib-entry-name{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink)}
.lib-entry-alias{font-size:11px;color:var(--faint)}
.lib-badge{font-size:10.5px;letter-spacing:.06em;border-radius:99px;padding:2px 8px;border:1px solid currentColor;flex:none}
.lib-character{color:var(--accent);background:var(--accent-soft)}
.lib-skill{color:var(--jade);background:#e8f2ee}
.lib-item{color:#8a6a2a;background:#f7eed8}
.lib-faction{color:#7a4b72;background:#f4eaf2}
.lib-place{color:#3f6780;background:#e9f1f5}
.lib-rule{color:#6b5b3e;background:#f1ece0}
.lib-lore{color:var(--muted);background:var(--panel-2)}
.lib-entry-summary{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.lib-entry-details{font-size:12px;line-height:1.75;color:var(--muted);white-space:pre-wrap;max-height:96px;overflow:auto}
.lib-entry-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.lib-char{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.lib-char[hidden]{display:none}
.lib-char-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-bottom:2px}
.lib-char-name{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink)}
.lib-char-count{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.lib-char-summary{font-size:13px;line-height:1.8;color:var(--ink-2)}
.lib-char-profile{font-size:12px;color:var(--muted)}
.lib-char-profile summary{cursor:pointer;color:var(--faint);font-size:12px}
.lib-char-detail{margin-top:6px;line-height:1.8;white-space:pre-wrap;color:var(--muted)}
.lib-char-actions{display:flex;gap:6px;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.lib-section{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.lib-section-title{font-size:12px;letter-spacing:.04em;color:var(--muted);display:flex;gap:7px;align-items:baseline}
.lib-section-title span{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.lib-sub{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.lib-sub[open]{border-color:var(--line-strong);background:var(--panel)}
.lib-sub summary{list-style:none;display:flex;align-items:center;gap:7px;cursor:pointer;flex-wrap:wrap}
.lib-sub summary::-webkit-details-marker{display:none}
.lib-sub-name{font-size:13px;font-weight:600;color:var(--ink)}
.lib-sub-peek{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.lib-sub-arrow{margin-left:auto;color:var(--faint);font-size:11px;transition:transform .15s}
.lib-sub[open] .lib-sub-arrow{transform:rotate(180deg)}
.lib-sub-body{display:flex;flex-direction:column;gap:5px;padding:9px 2px 2px;border-top:1px dashed var(--line);margin-top:7px}
.lib-sub-line{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;font-size:12px;line-height:1.75}
.lib-sub-label{color:var(--faint);font-size:11px;white-space:nowrap}
.lib-sub-text{color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.lib-sub-tags{display:flex;gap:5px;flex-wrap:wrap}
.lib-sub-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:3px}
.lib-unowned{display:flex;flex-direction:column;gap:10px}
.lib-unowned[hidden]{display:none}
.lib-unowned-head{font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:8px;padding:0 2px}
.lib-unowned-head span{font-size:11px;color:var(--faint)}
.lib-empty{grid-column:1/-1}
.lib-strict{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
.word-target{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.word-target input{width:72px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:12px;text-align:right}
.word-target select{width:auto;padding:5px 22px 5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:12px}
.word-target .unit{color:var(--faint)}

/* ---------- mobile guide ---------- */
.guide-body{min-height:310px}
.guide-hero{font-size:40px;line-height:1;margin:2px 0 14px}
.guide-title{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.35;color:var(--ink);margin:0 0 8px}
.guide-text{font-size:13.5px;line-height:1.85;color:var(--muted);margin:0}
.guide-list{margin:12px 0 0;padding-left:19px;font-size:12.5px;line-height:1.85;color:var(--ink-2)}
.guide-list li{margin:3px 0}
.guide-progress{font-size:11px;font-weight:400;color:var(--faint);margin-left:7px;letter-spacing:.06em}
.guide-dots{display:flex;justify-content:center;gap:6px;margin-top:20px}
.guide-dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);transition:all .18s}
.guide-dot.on{width:18px;border-radius:3px;background:var(--accent)}
.guide-install{margin-top:14px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .main{padding:26px 22px 70px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .write-layout{grid-template-columns:1fr}
  .chapter-nav{position:static;max-height:240px}
}
@media (max-width:840px){
  .shell{flex-direction:column}
  .sidebar{
    width:100%;height:auto;position:static;flex-direction:row;align-items:center;
    gap:8px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;
  }
  .project-meta,.side-foot{display:none}
  .steps{flex-direction:row;gap:4px;flex-wrap:nowrap}
  .step-btn{padding:7px 9px;white-space:nowrap;width:auto;flex:none}
  .step-label{font-size:12px}
  .grid2,.field-grid,.grid3{grid-template-columns:1fr}
  .topbar{padding:0 12px;gap:8px}
  .brand-text span{display:none}
  .project-select{max-width:130px}
  .main{padding:20px 14px 60px}
  h1{font-size:24px}
  .chapter-row{grid-template-columns:28px 1fr;grid-auto-rows:auto}
  .chapter-row .chapter-actions{grid-column:2}
  .inject-grid{grid-template-columns:1fr}
  .inject-drop{min-height:170px}
  .lib-layout{grid-template-columns:1fr}
  .lib-input-card{position:static}
  .lib-grid{grid-template-columns:1fr}
  .lib-sub-line{grid-template-columns:1fr;gap:1px}
  .lib-sub-peek{max-width:100%}
  .lib-char-count{margin-left:0}
}
@media (max-width:640px){
  html,body{overflow-x:hidden}
  .topbar{
    height:auto;min-height:56px;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  }
  .brand{gap:8px;min-width:0}
  .brand-mark{width:32px;height:32px;border-radius:8px;font-size:18px}
  .brand-text strong{font-size:16px;letter-spacing:.1em}
  .top-actions{flex:1 1 auto;min-width:0;gap:5px}
  #modeBadge{
    width:16px;height:16px;padding:0;border:0;flex:none;
    background:transparent!important;font-size:0;gap:0;justify-content:center;
  }
  #modeBadge::before{width:8px;height:8px}
  .project-select{
    flex:1 1 96px;width:auto;max-width:none;min-width:0;
    font-size:13px;padding:7px 25px 7px 9px;
  }
  .new-project-btn,.install-btn{width:38px;min-width:38px;height:38px;padding:0;flex:none}
  .np-label,.install-label{display:none}
  .np-icon{display:inline;font-size:18px}
  .icon-btn{width:38px;height:38px;font-size:17px}
  .shell{min-height:calc(100vh - 56px)}
  .sidebar{padding:8px 10px;gap:0;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .steps{width:max-content;min-width:100%;gap:4px}
  .step-btn{padding:8px 10px;min-height:42px}
  .step-label{font-size:12px}
  .main{padding:16px 12px calc(72px + env(safe-area-inset-bottom))}
  h1{font-size:21px;line-height:1.35}
  .page-head{margin-bottom:16px;gap:10px}
  .page-head .page-actions{width:100%;justify-content:flex-start}
  .card-pad{padding:14px}
  .grid2,.field-grid,.grid3,.char-grid,.style-grid{grid-template-columns:1fr}
  .field-grid{gap:10px}
  .btn{min-height:40px}
  .btn.small{padding:7px 10px;min-height:34px}
  .btn.tiny{min-height:32px}
  .input,.select,.textarea{font-size:16px;padding:10px 12px}
  .world-card .textarea{font-size:16px}
  .chapter-nav{max-height:200px}
  .chapter-nav .cn-item{min-height:40px;display:flex;align-items:center}
  .editor-head{padding:13px 14px 10px}
  .editor-title-row{gap:8px}
  #chapterContent{font-size:16px!important;min-height:56vh}
  .direct-fields{grid-template-columns:1fr}
  .lib-char{padding:14px 13px}
  .lib-char-name{font-size:17px}
  .lib-char-count{margin-left:0}
  .lib-sub summary{min-height:36px}
  .lib-sub-actions .btn{min-height:32px}
  .lib-toolbar{flex-wrap:wrap;gap:8px}
  #libSearch{flex:1 1 100%;min-width:0}
  #libTypeFilter{max-width:100%}
  .profile-row{grid-template-columns:74px minmax(0,1fr)}
  .modal-root{
    padding:8px;
    padding-top:calc(8px + env(safe-area-inset-top));
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  .modal{
    width:100%;border-radius:12px;
    max-height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  .modal-head{padding:14px 14px 10px}
  .modal-head h3{font-size:16px}
  .modal-body{padding:14px}
  .modal-foot{padding:10px 14px;flex-wrap:wrap}
  .modal-foot .btn{flex:1 1 auto}
  .gen-stream{height:36vh;min-height:160px;padding:12px;font-size:12px}
  .toasts{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:none}
  .toast{font-size:13px}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lib-entry{padding:11px 12px}
  .chapter-row{grid-template-columns:24px minmax(0,1fr);gap:8px;padding:10px}
  .chapter-row .chapter-actions{grid-column:2}
  .empty{padding:28px 16px}
  .inject-drop{min-height:150px}
  .guide-body{min-height:250px}
  .guide-hero{font-size:32px;margin-bottom:10px}
  .guide-title{font-size:19px}
  .guide-text{font-size:13px;line-height:1.8}
  .guide-list{font-size:12px;padding-left:17px}
  .guide-dots{margin-top:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">墨</div>
      <div class="brand-text"><strong>墨引</strong><span>小说 AI 工坊</span></div>
    </div>
    <div class="top-actions">
      <span class="badge" id="modeBadge" data-action="open-settings"></span>
      <select class="project-select" id="projectSelect" title="切换作品"></select>
      <button class="btn small install-btn" id="installBtn" data-action="install-app" title="安装到手机桌面" aria-label="安装到手机桌面" hidden><span aria-hidden="true">⤓</span><span class="install-label">安装 App</span></button>
      <button class="btn small new-project-btn" data-action="new-project" title="新建作品" aria-label="新建作品"><span class="np-label">新建作品</span><span class="np-icon" aria-hidden="true">＋</span></button>
      <button class="icon-btn" data-action="open-settings" title="API 与偏好设置" aria-label="API 与偏好设置">⚙</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="project-meta" id="projectMeta"></div>
      <nav class="steps" id="stepNav"></nav>
      <div class="side-foot">
        <button class="side-link" data-action="import-json">⇪ 导入项目 JSON</button>
        <button class="side-link" data-action="open-settings">⚙ API 与偏好设置</button>
        <button class="side-link" data-action="about">◎ 关于与使用说明</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-action="close-modal"></div>
  <div class="modal" id="modalBox"></div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============================================================
   墨引 · 小说 AI 工坊 —— 单文件应用
   数据层：文风库、题材、字段定义、演示内容
   ============================================================ */
const LS_KEY = 'moyin.novel.studio.v1';

/* ---------------- 通用小工具 ---------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const nowISO = () => new Date().toISOString();
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function countChars(s){ return (String(s||'').replace(/\s/g,'')).length; }
function firstLine(s){ return String(s||'').trim().split('\n')[0].slice(0, 60); }
function truncate(s, n){ s = String(s||''); return s.length > n ? s.slice(0, n) + '…' : s; }
function asArray(v){ return Array.isArray(v) ? v : []; }
function asList(v){ return Array.isArray(v) ? v : (typeof v === 'string' ? v.split(/[,，、;；]/) : []); }
function asText(v){ return v == null ? '' : String(v); }
function download(filename, text, mime='text/plain'){
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function todayName(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}

function demoProse(project, chapter, mode, style){
  const hero = (project.characters[0] && project.characters[0].name) || '他';
  const other = (project.characters[1] && project.characters[1].name) || '那个人';
  const place = flavorOf(project).place;
  const outline = (chapter && chapter.outline) || '主角面对新的局面，必须做出选择。';
  if(mode === 'restyle' && style){
    const sample = (style.sample || '').trim();
    if(sample){
      const clip = sample.length > 1200 ? sample.slice(0, 1200) + '……' : sample;
      return `（演示改写 · 文风「${style.name}」）\n\n${clip}\n\n（说明：演示模式用该文风的示例段落呈现改写方向；接入 API 后，会按你的正文逐句重写，而不是替换成样例。）`;
    }
    return `（演示改写 · 文风「${style.name}」）\n\n${(chapter && chapter.content || '').trim() || '（本章还没有正文）'}\n\n（说明：该自定义文风没有示例段落；接入 API 后可按文风画像重写。）`;
  }
  const opening = mode === 'continue'
    ? '（演示续写）风从檐下穿过去，把灯影晃了一晃。'
    : mode === 'polish'
      ? '（演示润色）天将亮未亮的时候，雾先一步进了城。'
      : '（演示文本）天将亮未亮的时候，' + place + '起了雾。';
  const paras = [
    opening,
    `${hero}站在门口，没有立刻进去。屋里的灯亮着，桌上摆着两副碗筷，像是早就知道他会来。\n\n“迟了半刻。”${other}的声音从里面传出来，不轻不重。\n\n“路上有人跟着。”${hero}把门带上，顺手落了闩，“绕了两条街。”\n\n屋里安静了一下。${other}替他把茶斟满，杯口没有一丝热气：“那就是说，他们想让你知道有人在跟。”`,
    `${hero}没有接话。他想起${outline.replace(/[。；]/g,'，')}。有些事一旦起了头，就由不得人喊停。\n\n“你怕了？”${other}问。\n\n“怕。”${hero}说得很干脆，“但我更怕什么都不知道就死。”\n\n${other}笑了一下，那笑意没到眼底：“行。那就从最不该查的地方查起。”`,
    `窗外的雾更浓了。远处传来第一声更鼓，像有人隔着一层布，往这世间轻轻敲了一下。\n\n${hero}把茶一口饮尽，苦得舌根发麻。他忽然明白，从今夜起，退路这条东西，已经不在他的选项里了。\n\n（演示模式内容，用于跑通流程；填入 API Key 后可调用真实模型创作。）`,
  ];
  return paras.join('\n\n');
}

/* ============================================================
   AI 层：OpenAI 兼容接口、流式生成、演示模式、提示词
   ============================================================ */
function apiUrl(){
  let b = (store.settings.baseURL || '').trim().replace(/\/+$/, '');
  if(!b) b = 'https://api.deepseek.com';
  if(/\/chat\/completions$/.test(b)) return b;
  return b + '/chat/completions';
}
function friendlyError(err){
  const msg = err && err.message ? err.message : String(err);
  if(/Failed to fetch|NetworkError|load failed/i.test(msg)) return '网络请求失败：请检查网络、baseURL 是否正确，或浏览器是否拦截了跨域请求。';
  if(/HTTP 401/.test(msg)) return 'API Key 无效或已过期（401）。请在设置中检查 Key。';
  if(/HTTP 402/.test(msg)) return '账户余额不足（402）。请到服务商后台充值。';
  if(/HTTP 429/.test(msg)) return '请求过于频繁或额度受限（429），请稍后再试。';
  if(/HTTP 404/.test(msg)) return '接口地址不存在（404）。请检查 baseURL，DeepSeek 常见为 https://api.deepseek.com（无需 /v1）。';
  return msg;
}
function isDeepSeekEndpoint(){
  try {
    const host = new URL(apiUrl()).hostname.toLowerCase();
    return host === 'deepseek.com' || host.endsWith('.deepseek.com');
  } catch(e){ return /deepseek\.com/i.test(store.settings.baseURL || ''); }
}
async function callChat(messages, { onDelta, onReasoning, signal, temperature, maxTokens, allowThinking=false } = {}){
  const key = (store.settings.apiKey || '').trim();
  const deepseek = isDeepSeekEndpoint();
  const body = {
    model: store.settings.model || 'deepseek-flash',
    messages,
    temperature: temperature == null ? (Number.isFinite(Number(store.settings.temperature)) ? Number(store.settings.temperature) : 0.85) : temperature,
    max_tokens: maxTokens || (deepseek ? 8192 : 4096),
    stream: true,
  };
  // DeepSeek 默认开启思考模式；大纲这类长 JSON 很容易把 token 全花在 reasoning 上，
  // 导致 content 为空。默认关闭，保证最终正文能流式返回。
  // 只对明确支持 thinking 的新模型传该字段，避免旧模型/兼容网关因未知参数报 400。
  if(deepseek && /^deepseek-(flash|v4)/i.test(body.model)) body.thinking = { type: allowThinking ? 'enabled' : 'disabled' };
  const res = await fetch(apiUrl(), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify(body),
    signal,
  });
  if(!res.ok){
    let t = '';
    try { t = await res.text(); } catch(e){}
    throw new Error(`API 请求失败（HTTP ${res.status}）${t ? '：' + t.slice(0, 300) : ''}`);
  }
  let content = '', reasoning = '', finish = null;
  const pushContent = d => { if(!d) return; content += d; if(onDelta) onDelta(d); };
  const pushReasoning = r => { if(!r) return; reasoning += r; if(onReasoning) onReasoning(r); };
  const takeChunk = j => {
    const ch = j && j.choices && j.choices[0];
    if(!ch) return;
    if(ch.finish_reason) finish = ch.finish_reason;
    const d = ch.delta || {};
    if(typeof d.content === 'string') pushContent(d.content);
    if(typeof d.reasoning_content === 'string') pushReasoning(d.reasoning_content);
  };
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  if(!ct.includes('text/event-stream')){
    const j = await res.json();
    const m = (j.choices && j.choices[0] && j.choices[0].message) || {};
    if(j.choices && j.choices[0] && j.choices[0].finish_reason) finish = j.choices[0].finish_reason;
    if(typeof m.content === 'string') pushContent(m.content);
    if(typeof m.reasoning_content === 'string') pushReasoning(m.reasoning_content);
    return { content, reasoning, finish };
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '';
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    let idx;
    while((idx = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, idx).replace(/\r$/, '').trim();
      buf = buf.slice(idx + 1);
      if(!line || line.startsWith(':')) continue;
      if(!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') return { content, reasoning, finish };
      try { takeChunk(JSON.parse(data)); } catch(e){ /* 忽略不完整片段 */ }
    }
  }
  buf += dec.decode();
  const tail = buf.trim();
  if(tail.startsWith('data:')){
    const data = tail.slice(5).trim();
    if(data && data !== '[DONE]'){
      try { takeChunk(JSON.parse(data)); } catch(e){ /* 忽略不完整片段 */ }
    }
  }
  return { content, reasoning, finish };
}
function demoStream(text, { onDelta, signal } = {}){
  return new Promise((resolve, reject) => {
    let i = 0;
    const step = Math.max(1, Math.ceil(text.length / 380));
    const tick = () => {
      if(signal && signal.aborted) return reject(new DOMException('Aborted', 'AbortError'));
      if(i >= text.length) return resolve();
      const piece = text.slice(i, i + step);
      i += step;
      try { onDelta(piece); } catch(e){ return reject(e); }
      setTimeout(tick, 14);
    };
    setTimeout(tick, 220);
  });
}
function extractJSON(s){
  if(!s) return null;
  let t = String(s).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch(e){}
  try { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); } catch(e){}
  return null;
}

/* ---------------- 上下文与提示词 ---------------- */
function baseSystem(){
  return '你是一位资深中文小说作者与编辑，擅长长篇连载的架构与写作。你严格遵守用户给出的世界观、人物、情节与文风要求，文字准确、有画面感、少空话。除非明确要求，不输出任何解释、序言、markdown 标题，或“以下是”之类的套话。';
}
function worldDigest(p){
  const w = p.world;
  const rows = [
    `作品名：${p.name || w.title || '未命名'}`,
    `题材：${p.genre || '未定'}`,
    `灵感：${truncate(p.idea || '（未填写）', 260)}`,
    w.era && `时代背景：${truncate(w.era, 300)}`,
    w.geo && `地理格局：${truncate(w.geo, 300)}`,
    w.factions && `势力组织：${truncate(w.factions, 300)}`,
    w.power && `规则体系：${truncate(w.power, 300)}`,
    w.society && `社会文化：${truncate(w.society, 300)}`,
    w.conflict && `核心冲突：${truncate(w.conflict, 320)}`,
    w.tone && `故事基调：${truncate(w.tone, 200)}`,
  ].filter(Boolean);
  return rows.join('\n');
}
function charDigest(p, limit=8){
  if(!p.characters.length) return '（尚未设计人物）';
  return p.characters.slice(0, limit).map(c => {
    return `- ${c.name}（${c.role}）：${truncate(c.identity, 90)}；性格：${truncate(c.personality, 60)}；动机：${truncate(c.motivation, 60)}${c.secret ? '；秘密：' + truncate(c.secret, 80) : ''}`;
  }).join('\n');
}
function wordTargetOf(p, ch){
  const raw = Number(ch && ch.wordTarget) || Number(p.wordTarget) || 2200;
  return clamp(Math.round(raw), 500, 6000);
}
function libTypeLabel(type){ return (LIB_TYPE_MAP[type] && LIB_TYPE_MAP[type].label) || '其他'; }
function libraryDigest(p, budget=2800){
  const entries = (p.library && p.library.entries) || [];
  if(!entries.length) return '（资料库为空：尚未投喂任何人物或设定材料）';
  const typeOrder = LIB_TYPES.map(t => t.key);
  const sorted = entries.slice().sort((a,b) => typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type));
  const lines = [];
  let used = 0;
  for(const e of sorted){
    const alias = e.aliases && e.aliases.length ? `（别名：${e.aliases.join('、')}）` : '';
    const detail = e.details ? '；' + truncate(e.details.replace(/\s+/g,' '), 220) : '';
    const owner = e.owner && e.type !== 'character' ? `（归属：${e.owner}）` : '';
    const line = `- 【${libTypeLabel(e.type)}】${e.name}${alias}${owner}：${truncate(e.summary || '（无摘要）', 160)}${detail}`;
    if(used + line.length > budget){ lines.push('……（资料库还有更多条目，已按优先级截断）'); break; }
    lines.push(line); used += line.length;
  }
  return lines.join('\n');
}
function libraryStrictRule(p){
  if(!p.library || !p.library.entries.length) return '资料库暂无记录：以人物卡和世界观为准，不要凭空新增关键能力、关键道具或世界规则。';
  if(p.library.strict === false) return '资料库仅作参考，可以补充合理细节。';
  return '【资料库是权威事实层】资料库与人物卡中已记录的人物、技能、物品、势力、地点与规则必须按原样使用；不得给角色新增未记录的关键能力，不得让角色使用未记录的关键道具，也不得违反已记录的代价/限制。普通场景细节可以合理补足；若剧情确实需要新设定，用【待补：……】明确标出，不要把它当作既成事实。';
}
function stylePrompt(style, strength){
  const st = STYLE_STRENGTHS[strength] || STYLE_STRENGTHS.medium;
  const pr = style.profile || {};
  return `【文风要求：${style.name}】\n${style.instruction || ''}\n强度：${st.label}（${st.desc}）。\n风格画像：人称—${pr.person||'—'}；节奏—${pr.rhythm||'—'}；句式—${pr.sentence||'—'}；对话—${pr.dialogue||'—'}；描写侧重—${pr.focus||'—'}；钩子设计—${pr.hook||'—'}；禁忌—${pr.taboo||'—'}。`;
}
function prevChapterDigest(ch, n=2){
  const list = allChapters();
  const idx = list.findIndex(x => x.ch.id === ch.id);
  if(idx <= 0) return '（本章是开篇）';
  return list.slice(Math.max(0, idx - n), idx).map(x => {
    const tail = (x.ch.content || '').trim();
    return `- 《${x.ch.title}》细纲：${truncate(x.ch.outline, 140)}${tail ? '\n  结尾片段：' + tail.slice(-420) : ''}`;
  }).join('\n');
}
function askJSON(instruction){
  return instruction + '\n\n严格要求：只输出一个合法的 JSON 对象，不要使用 markdown 代码块，不要输出任何解释、前言或后记。所有内容使用中文，具体、可写、避免空泛套话。';
}

    : '设计 3 卷左右、每卷 4 章；主线有明确的起承转合与至少两次重大反转。';
  const user = askJSON(`根据世界设定、人物与资料库，为这部长篇小说设计主线与分卷大纲。

${worldDigest(p)}

人物：
${charDigest(p)}

${libraryDigest(p)}

${libraryStrictRule(p)}

要求：${structure}章节细纲要具体到“谁做了什么、局面如何变化”，不要写“主角遇到危险”这种空话。章末尽量留钩子。

{

  return [{ role:'system', content:baseSystem() }, { role:'user', content:user }];
}
function buildLibraryEntriesMessages(p, text, title, limit=30){

${existing}

${truncate(text, 20000)}

function buildProseMessages(p, ch, mode, style){

  const ctx = `【世界设定】\n${worldDigest(p)}\n\n【人物】\n${charDigest(p, 10)}\n\n【资料库（权威设定）】\n${libraryDigest(p, 3000)}\n\n【全书主线】\n${truncate(p.outline.mainline, 500) || '（未填写）'}\n\n【前情】\n${prevChapterDigest(ch)}`;
  const outline = ch.outline ? `本章细纲：${ch.outline}` : '（本章没有细纲，请依据上下文合理推进剧情）';
  let task = '';

  } else if(mode === 'continue'){
    const tail = (ch.content || '').slice(-1200);
    task = `请从下面现有正文的结尾自然续写约 ${target} 字。${outline}\n要求：不要重复已有内容，不要另起标题，衔接语气与节奏；推进新的信息或冲突。\n${libraryStrictRule(p)}\n资料库已记录的能力、物品、势力与规则必须按原样使用，不要临时发明新的能力或关键道具。\n\n现有正文结尾：\n${tail}\n\n只输出续写的新内容。`;
  } else if(mode === 'polish'){
    task = `请对我下面的正文进行润色重写：情节、信息量与人物关系完全不变，优化节奏、画面感、对话与语言质感，删掉空话和重复表达。篇幅与原文接近。${libraryStrictRule(p)}只输出改写后的正文，不要解释。\n\n原文：\n${truncate(ch.content, 7000)}`;
  } else {
    task = `请把下面这段正文改写成指定文风：情节、对话内容与关键信息不变，只改变叙述腔调、句式、节奏与用词。篇幅接近原文。${libraryStrictRule(p)}只输出改写后的正文，不要解释。\n\n原文：\n${truncate(ch.content, 7000)}`;
  }
  return [
    { role:'system', content:baseSystem() },
    { role:'system', content:stylePrompt(style, strength) },
    { role:'user', content:`${ctx}\n\n${task}` },
  ];
}
function proseMaxTokens(p, ch, mode){

}

async function structuredGen(opts){
  if(ui.busy){ toast('正在生成中，请稍候', 'err'); return; }
  const { title, messages, demoText, onParsed, wide=false, truncatedHint='' } = opts;
  ui.busy = true;
  const controller = new AbortController();
  const genObj = { controller, closed:false, retry: () => { ui.busy = false; structuredGen(opts); } };
  ui.gen = genObj;
  openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="gen-status" id="genStatus"><span class="dot"></span><span id="genStatusText">${hasKey() ? '正在调用模型生成…' : '演示模式：正在生成示例内容…'}</span></div>
      <div class="gen-stream" id="genStream"></div>
      <p class="hint" style="margin-top:8px">${hasKey() ? '内容由你配置的模型实时生成，生成结果会先经过校验再写入。' : '当前为演示内容。填写 API Key 后可让模型按你的设定真实创作。'}</p>
    </div>
    <div class="modal-foot" id="genFoot">
      <button class="btn" data-action="stop-gen">停止</button>
    </div>`, { wide });
  const pre = document.getElementById('genStream');
  const statusText = document.getElementById('genStatusText');
  let raw = '', meta = null;
  const append = d => {
    raw += d;
    if(genObj.closed || !pre || !pre.isConnected) return;
    pre.textContent = raw;
    pre.scrollTop = pre.scrollHeight;
    if(statusText) statusText.textContent = hasKey() ? '正在生成…' : '演示模式生成中…';
  };
  try {
    if(hasKey()) meta = await callChat(messages, { onDelta:append, signal:controller.signal, maxTokens: isDeepSeekEndpoint() ? 8192 : 4096 });
    else await demoStream(demoText, { onDelta:append, signal:controller.signal });
    if(controller.signal.aborted) throw new DOMException('Aborted', 'AbortError');
    const data = extractJSON(raw);
    if(!data){
      let why = '模型返回的内容无法解析为 JSON。可以点“重试”重新生成，或检查模型是否支持 JSON 输出。';
      if(meta && meta.finish === 'length') why = '模型输出被截断（finish_reason=length），JSON 没写完。' + (truncatedHint || '请点“重试”，或缩小本次生成规模后再试。');
      else if(meta && meta.finish === 'content_filter') why = '模型输出被内容安全策略截断，请调整设定后重试。';
      else if(meta && !String(meta.content || '').trim() && String(meta.reasoning || '').trim()) why = '模型只返回了思考内容，没有返回最终 JSON。应用已默认关闭思考模式，请点“重试”；若仍失败，请在设置里把模型改为 deepseek-flash 并确认 baseURL 为 https://api.deepseek.com。';
      else if(meta && !String(meta.content || '').trim()) why = '模型返回了空内容（finish_reason=' + (meta.finish || '未知') + '）。请先点“重试”；若持续为空，请在设置里确认模型名与 baseURL，或换用支持 JSON 输出的模型。';
      throw new Error(why);
    }
    if(ui.gen === genObj){ ui.gen = null; ui.busy = false; }
    closeModal();
    try { onParsed(data); }
    catch(err){ console.error(err); toast('写入失败：' + friendlyError(err), 'err', 5200); }
  } catch(err){
    if(ui.gen && ui.gen !== genObj) return; // 已开启新一轮生成，旧任务不再干扰界面
    const aborted = err && err.name === 'AbortError';
    ui.busy = false;
    if(ui.gen === genObj) ui.gen.controller = null;
    if(genObj.closed || !document.getElementById('genStatus')) return;
    const status = document.getElementById('genStatus');
    if(status) status.innerHTML = `<span style="color:${aborted?'var(--muted)':'var(--accent)'}">${aborted ? '已停止生成。' : '生成失败'}</span>`;
    const st = document.getElementById('genStatusText'); if(st) st.textContent = '';
    const foot = document.getElementById('genFoot');
    if(foot){
      foot.innerHTML = `<button class="btn" data-action="close-modal">关闭</button>
        <button class="btn accent" data-action="retry-gen">重试</button>`;
    }
    if(!aborted){
      const box = document.getElementById('genStream');
      if(box) box.insertAdjacentHTML('afterend', `<p class="hint" style="color:var(--accent);margin-top:10px">${esc(friendlyError(err))}</p>`);
      else toast('生成失败：' + friendlyError(err), 'err', 5200);
    }
  }
}

function proseTask(mode){
  const found = findChapter(ui.currentChapterId);
  if(!found){ toast('请先在「大纲」里创建章节', 'err'); return; }
  if(ui.busy){ toast('正在生成中，请稍候', 'err'); return; }
  const ch = found.chapter;
  if(mode === 'continue' && countChars(ch.content) < 10){ toast('本章还没有内容，请先生成本章', 'err'); return; }
  if((mode === 'polish' || mode === 'restyle') && countChars(ch.content) < 20){ toast('本章还没有足够的正文可供改写', 'err'); return; }
  if(mode === 'gen' && countChars(ch.content) > 60){
    confirmDialog('覆盖本章正文？', '本章已有正文。重新生成会清空现有内容并从头撰写，确定继续吗？', () => runProse('gen'), '覆盖并生成');
    return;
  }
  if(mode === 'polish' || mode === 'restyle') return runProsePreview(mode);
  runProse(mode);
}
function draftChapterTitle(text){
  let t = asText(text).replace(/（[^）]{0,24}）/g, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/^第[一二三四五六七八九十百千万\d]+[章卷回节][\s·:：、.\-—]*/, '');
  const first = t.split(/[。！？!?；;\n]/)[0].trim();
  t = first.replace(/[，,、：:；“”"'《》]/g, ' ').replace(/\s+/g, ' ').trim();
  if(t.length > 18) t = t.slice(0, 18);
  return t || '未命名章节';
}
function chapterTitleLength(ch){
  const n = Number(ch && ch.titleLength);
  return Number.isFinite(n) && n >= 1 ? clamp(Math.round(n), 1, 24) : 12;
}
function cleanChapterTitle(value, maxLen=24){
  let t = asText(value).trim().replace(/^[\s《》“”"'‘’]+|[\s《》“”"'‘’]+$/g, '');
  t = t.replace(/^第[一二三四五六七八九十百千万\d]+[章回节][\s·:：、.\-—]*/, '');
  return t.slice(0, maxLen);
}
function titleLengthOptions(selected){
  const cur = clamp(Number(selected) || 12, 1, 24);
  return Array.from({length:24}, (_,i) => i + 1)
    .map(n => `<option value="${n}" ${n === cur ? 'selected' : ''}>${n} 字</option>`).join('');
}
function buildChapterTitleMessages(p, ch){
  const target = chapterTitleLength(ch);
  return [
    { role:'system', content:baseSystem() },
    { role:'user', content:`请为下面这一章正文取一个中文标题。
要求：标题长度为 ${target} 个字（目标 1-24 字，尽量正好 ${target} 个字，最多 24 个字），有画面感或悬念，能让人想点开；不剧透结局；不要章节编号、书名号、引号；不要解释。
只输出 JSON：{"title":"……"}

本章大纲：
${truncate(ch.outline, 900) || '（无）'}

正文：
${truncate(ch.content, 3200)}` },
  ];
}
async function suggestChapterTitle(p, ch){
  const snapshot = ch.content;
  let title = '';
  if(hasKey()){
    try {
      const raw = await callChat(buildChapterTitleMessages(p, ch), { maxTokens:120, temperature:0.8 });
      const data = extractJSON((raw && raw.content) || '');
      title = cleanChapterTitle(data && data.title, chapterTitleLength(ch));
    } catch(err) { /* 标题失败不打断正文，回退本地标题 */ }
  }
  if(!title) title = cleanChapterTitle(draftChapterTitle(ch.content || ch.outline), chapterTitleLength(ch));
  if(!title || ch.content !== snapshot) return;
  ch.title = title;
  touch(); syncChrome();
  if(ui.page === 'writing' && ui.currentChapterId === ch.id) renderPage();
}

async function runProse(mode, opts={}){
  const found = findChapter(ui.currentChapterId);
  if(!found) return;
  const p = proj(), ch = found.chapter;
  const before = ch.content;
  const style = chapterStyle(ch);
  const ta = document.getElementById('chapterContent');
  ui.busy = true;
  const controller = new AbortController();
  ui.gen = { controller };
  setEditorBusy(true);
  if(mode === 'gen') ch.content = '';
  if(mode === 'continue' && ch.content.trim() && !ch.content.endsWith('\n\n')) ch.content += '\n\n';
  if(ta) ta.value = ch.content;
  try {
    const messages = buildProseMessages(p, ch, mode, style);
    const onDelta = d => {
      ch.content += d;
      if(ta){ ta.value = ch.content; ta.scrollTop = ta.scrollHeight; }
      updateWordCount();
    };
    if(hasKey()) await callChat(messages, { onDelta, signal:controller.signal, maxTokens:proseMaxTokens(p, ch, mode) });
    else await demoStream(demoProse(p, ch, mode, style), { onDelta, signal:controller.signal });
    toast(mode === 'gen' ? (opts.autoTitle ? '正文完成，正在按内容取标题…' : '本章生成完成') : '续写完成', 'ok');
  } catch(err){
    if(err && err.name === 'AbortError'){
      toast('已停止生成，保留已生成的部分');
    } else if(mode === 'gen' && !ch.content.trim() && before){
      ch.content = before;
      if(ta) ta.value = before;
      toast('生成失败，已恢复原正文：' + friendlyError(err), 'err', 5600);
    } else {
      toast(friendlyError(err), 'err', 5200);
    }
  } finally {
    ui.busy = false; ui.gen = null;
    touch();
    syncChrome();
    renderPage();
  }
  if(opts.autoTitle && ch.content.trim()) suggestChapterTitle(p, ch);
}

/* ---------------- 连接测试 ---------------- */
async function testConnection(btn){
  const key = (document.getElementById('setKey')?.value || '').trim();
  const base = (document.getElementById('setBase')?.value || '').trim();
  const model = (document.getElementById('setModel')?.value || '').trim() || 'deepseek-flash';
  if(!key) return toast('请先填写 API Key', 'err');
  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '测试中…';
  try {
    let url = (base || 'https://api.deepseek.com').replace(/\/+$/, '');
    if(!/\/chat\/completions$/.test(url)) url += '/chat/completions';
    const body = { model, messages:[{ role:'user', content:'只回复：连接成功' }], max_tokens:64, stream:false };
    if(/deepseek\.com/i.test(url) && /^deepseek-(flash|v4)/i.test(model)) body.thinking = { type:'disabled' };
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
      body: JSON.stringify(body),
    });
    if(!res.ok){ const t = await res.text(); throw new Error(`HTTP ${res.status}：${t.slice(0,160)}`); }
    const j = await res.json();
    const c = j.choices?.[0]?.message?.content || '';
    toast('连接成功：' + (c.trim() || '模型已响应'), 'ok');
  } catch(e){
    toast('连接失败：' + friendlyError(e), 'err', 5600);
  } finally {
    btn.disabled = false; btn.innerHTML = old;
  }
}

function inferredLibraryOwner(e){
  const text = asText(e.details) + '\n' + asText(e.summary);
  const m = text.match(/(?:掌握者|持有者|拥有者|归属|属于)[：:]\s*([^\n，。；;]{1,20})/);
  return m ? m[1].trim() : '';
}
function libraryGroups(p){
  const entries = p.library.entries || [];
  const charMap = new Map();
  const register = (value, canonical) => {
    const k = asText(value).trim().toLowerCase();
    if(k && canonical && !charMap.has(k)) charMap.set(k, canonical);
  };
  entries.filter(e => e.type === 'character').forEach(e => {
    register(e.name, e.name);
    asList(e.aliases).forEach(a => register(a, e.name));
  });
  (p.characters || []).forEach(c => register(c.name, c.name));
  const groups = new Map();
  entries.forEach(e => {
    let owner = '';
    if(e.type === 'character') owner = e.name;
    else {
      const raw = asText(e.owner).trim() || inferredLibraryOwner(e);
      if(raw) owner = charMap.get(raw.toLowerCase()) || raw;
    }
    if(!groups.has(owner)) groups.set(owner, { owner, entries:[] });
    groups.get(owner).entries.push(e);
  });
  const rank = new Map();
  (p.characters || []).forEach((c, i) => rank.set(c.name, i));
  entries.filter(e => e.type === 'character').forEach((e, i) => {
    if(!rank.has(e.name)) rank.set(e.name, 50 + i);
  });
  return Array.from(groups.values()).sort((a, b) => {
    if(!a.owner) return 1;
    if(!b.owner) return -1;
    const ra = rank.has(a.owner) ? rank.get(a.owner) : 500;
    const rb = rank.has(b.owner) ? rank.get(b.owner) : 500;
    return ra - rb;
  });
}
function libGroupCountText(list){
  const counts = {};
  list.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });
  return LIB_TYPES.filter(t => counts[t.key]).map(t => `${t.label} ${counts[t.key]}`).join(' · ');
}
function viewLibrary(){
  const p = proj(), lib = p.library;
  const q = ui.libQuery || '', filter = ui.libType || '';
  const entries = lib.entries;
  const groups = libraryGroups(p);
  const counts = {};
  LIB_TYPES.forEach(t => { counts[t.key] = entries.filter(e => e.type === t.key).length; });
  const entryCard = e => {
    const alias = e.aliases && e.aliases.length ? `<span class="lib-entry-alias">${esc(e.aliases.join(' / '))}</span>` : '';
    const tags = (e.tags || []).map(t => `<span class="trait">${esc(t)}</span>`).join('');
    const ownerName = e.type !== 'character' ? (asText(e.owner).trim() || inferredLibraryOwner(e)) : '';
    const owner = ownerName ? `<span class="lib-owner">归属 · ${esc(ownerName)}</span>` : '';
    return `<div class="card lib-entry" data-lib-entry data-entry-id="${e.id}" data-type="${e.type}" data-search="${esc((e.name + ' ' + (e.aliases||[]).join(' ') + ' ' + (e.owner||'') + ' ' + inferredLibraryOwner(e) + ' ' + e.summary + ' ' + e.details + ' ' + (e.tags||[]).join(' ')).toLowerCase())}">
      <div class="lib-entry-head">
        <span class="lib-badge lib-${e.type}">${libTypeLabel(e.type)}</span>
        <span class="lib-entry-name">${esc(e.name)}</span>
        ${alias}
      </div>
      ${e.summary ? `<div class="lib-entry-summary">${esc(e.summary)}</div>` : ''}
      ${e.details ? `<div class="lib-entry-details">${esc(e.details)}</div>` : ''}
      <div class="lib-entry-foot">
        ${owner}
        ${tags}
        <div class="spacer" style="flex:1"></div>
        <button class="btn tiny ghost" data-action="lib-edit" data-lid="${e.id}">编辑</button>
        <button class="btn tiny ghost" data-action="lib-del" data-lid="${e.id}">删除</button>
      </div>
    </div>`;
  };
  const subItem = e => {
    const effect = asText(e.summary).trim();
    const detail = asText(e.details).trim();
    const tags = (e.tags || []).map(t => `<span class="trait">${esc(t)}</span>`).join('');
    const hay = [e.name, ...(e.aliases || []), e.owner, effect, detail, ...(e.tags || [])].join(' ').toLowerCase();
    return `<details class="lib-sub" data-lib-sub data-type="${e.type}" data-search="${esc(hay)}">
      <summary>
        <span class="lib-badge lib-${e.type}">${libTypeLabel(e.type)}</span>
        <span class="lib-sub-name">${esc(e.name)}</span>
        ${effect ? `<span class="lib-sub-peek">${esc(truncate(effect, 40))}</span>` : ''}
        <span class="lib-sub-arrow">▾</span>
      </summary>
      <div class="lib-sub-body">
        <div class="lib-sub-line"><span class="lib-sub-label">效果 / 用途</span><span class="lib-sub-text">${esc(effect || '未记录')}</span></div>
        <div class="lib-sub-line"><span class="lib-sub-label">代价 / 限制</span><span class="lib-sub-text">${esc(detail || '未记录')}</span></div>
        ${tags ? `<div class="lib-sub-tags">${tags}</div>` : ''}
        <div class="lib-sub-actions">
          <button class="btn tiny ghost" data-action="lib-edit" data-lid="${e.id}">编辑</button>
          <button class="btn tiny ghost" data-action="lib-del" data-lid="${e.id}">删除</button>
        </div>
      </div>
    </details>`;
  };
  const charSection = (title, list) => list.length ? `<div class="lib-section">
      <div class="lib-section-title">${title}<span>${list.length}</span></div>
      ${list.map(subItem).join('')}
    </div>` : '';
  const charBox = g => {
    const profile = g.entries.find(e => e.type === 'character') || null;
    const name = profile ? profile.name : (g.owner || '未命名人物');
    const aliases = profile && profile.aliases && profile.aliases.length ? profile.aliases.join(' / ') : '';
    const skills = g.entries.filter(e => e.type === 'skill');
    const items = g.entries.filter(e => e.type === 'item');
    const others = g.entries.filter(e => e.type !== 'character' && e.type !== 'skill' && e.type !== 'item');
    const types = Array.from(new Set(g.entries.map(e => e.type))).join(',');
    const hay = g.entries.map(e => [e.name, ...(e.aliases || []), e.owner, e.summary, e.details, ...(e.tags || [])].join(' ')).join(' ').toLowerCase();
    const summary = profile ? asText(profile.summary).trim() : '';
    const details = profile ? asText(profile.details).trim() : '';
    const countBits = [];
    if(skills.length) countBits.push(`技能 ${skills.length}`);
    if(items.length) countBits.push(`物品 ${items.length}`);
    if(others.length) countBits.push(`其他 ${others.length}`);
    return `<div class="card lib-char" data-lib-char data-types="${types}" data-entry-count="${g.entries.length}" data-search="${esc(hay)}">
      <div class="lib-char-head">
        <span class="lib-badge lib-character">人物</span>
        <span class="lib-char-name">${esc(name)}</span>
        ${aliases ? `<span class="lib-entry-alias">${esc(aliases)}</span>` : ''}
        <span class="lib-char-count">${countBits.length ? countBits.join(' · ') : '人物档案'}</span>
      </div>
      ${summary ? `<div class="lib-char-summary">${esc(summary)}</div>` : ''}
      ${details ? `<details class="lib-char-profile"><summary>人物档案详情</summary><div class="lib-char-detail">${esc(details)}</div></details>` : ''}
      ${!profile ? `<div class="faint small" style="padding:2px 0">资料库里没有这个人物的人物条目；技能/物品已按归属收在这里，可去「人物」页补一张人物卡。</div>` : ''}
      ${charSection('技能 / 底牌', skills)}
      ${charSection('物品 / 装备', items)}
      ${charSection('其他归属', others)}
      ${!skills.length && !items.length && !others.length ? `<div class="faint small" style="padding:4px 0 2px">暂时没有归属到这个人物名下的技能、物品或其他设定。</div>` : ''}
      ${profile ? `<div class="lib-char-actions"><button class="btn tiny ghost" data-action="lib-edit" data-lid="${profile.id}">编辑人物档案</button><button class="btn tiny ghost" data-action="lib-del" data-lid="${profile.id}">删除档案</button></div>` : ''}
    </div>`;
  };
  const characterGroups = groups.filter(g => g.owner);
  const unownedGroup = groups.find(g => !g.owner);
  const sources = lib.sources.length ? lib.sources.map(s => `<div class="lib-source">
      <span title="${esc(s.title)}">${esc(truncate(s.title, 18))}</span>
      <span class="faint">${(s.text || '').length} 字</span>
      <div class="spacer"></div>
      <button class="icon-btn" data-action="lib-del-source" data-sid="${s.id}" title="删除这份原始资料（已提取条目保留）">✕</button>
    </div>`).join('') : '<div class="faint small">还没有原始资料。粘贴一段文字，或选择一个 txt / md / json / csv 文件。</div>';
  return `<div class="page">
    <div class="page-head">
      <div>
        <div class="step-chip">STEP 03 · LIBRARY</div>
        <h1>人物资料库</h1>
        <div class="page-sub">把人物小传、技能设定、势力关系、零散灵感整段丢进来。AI 只提取材料里明确写到的内容，沉淀成可检索的设定；文件导入后会自动识别，并把符合条件的人物补进人物模块、把世界信息补进世界观。写大纲和正文时，会优先从这里调取，避免临时乱编。</div>
      </div>
      <div class="page-actions">
        <label class="lib-strict" title="开启后，写作提示词会明确要求只使用资料库中记录的能力、物品与规则">
          <input type="checkbox" data-action="lib-strict" ${lib.strict ? 'checked' : ''}> 写作严格依据资料库
        </label>
        <button class="btn" data-action="lib-add">+ 手动添加条目</button>
      </div>
    </div>
    ${demoBanner()}
    <div class="lib-layout">
      <div class="card card-pad lib-input-card">
        <div class="section-title">投喂原始材料 <small>越具体越好</small></div>
        <div class="field"><label>资料名（可留空）</label><input class="input" id="libTitle" placeholder="例如：主角团设定集 / 第三卷势力关系"></div>
        <div class="field"><label>粘贴材料</label><textarea class="textarea" id="libText" style="min-height:180px" placeholder="直接把大杂烩粘进来：人物小传、技能表、物品来历、宗门关系、历史传闻、对话片段都可以。&#10;&#10;AI 会拆成人物 / 技能 / 物品 / 势力 / 地点 / 规则等条目，并把可入库的人物、世界观字段同步到对应模块；没写的字段不会替你编。"></textarea></div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-action="lib-extract">✦ 识别并入库</button>
          <button class="btn" data-action="lib-save-source">仅存原文</button>
          <button class="btn ghost" data-action="lib-pick-file">选择文件</button>
          <input type="file" id="libFile" accept=".txt,.md,.markdown,.json,.csv,text/plain,text/markdown,application/json,text/csv" hidden>
        </div>
        <p class="hint" style="margin-top:9px">原始资料会保留在项目里；提取失败也不会丢。选择文件后会直接自动识别（需先配置 API Key）；演示模式下可点「识别并入库」看内置示例。</p>
        <div class="section-title" style="margin:16px 0 6px">已投喂来源 <small>${lib.sources.length} 份</small></div>
        <div class="lib-sources">${sources}</div>
      </div>
      <div>
        <div class="lib-toolbar">
          <input class="input" id="libSearch" value="${esc(q)}" placeholder="搜索人物、技能、物品、别名……">
          <select class="select" id="libTypeFilter" style="width:auto;min-width:118px">
            <option value="">全部类型</option>
            ${LIB_TYPES.map(t => `<option value="${t.key}" ${filter===t.key?'selected':''}>${t.label}（${counts[t.key]}）</option>`).join('')}
          </select>
          <span class="faint small" id="libCount">${entries.length} 条设定 · ${characterGroups.length} 个人物框</span>

            ${characterGroups.map(charBox).join('')}

        </div>

    <div class="row" style="justify-content:space-between;margin-top:20px">
      <button class="btn ghost" data-action="nav" data-page="characters">← 返回人物</button>
      <button class="btn" data-action="nav" data-page="outline">下一步：生成大纲 →</button>
    </div>
  </div>`;
}

function viewOutline(){
  const p = proj(), o = p.outline;
  const volumes = o.volumes.map((v, vi) => {
    const chapters = v.chapters.map((ch, ci) => `
      <div class="chapter-row" data-vid="${v.id}" data-chid="${ch.id}">
        <div class="chapter-no">${String(ci+1).padStart(2,'0')}</div>
        <input class="input" data-ch-field="title" value="${esc(ch.title)}" placeholder="章节名">

function buildMarkdown(p){
  const lines = [];
  lines.push(`# ${p.name || '未命名作品'}`, '');
  lines.push(`> 题材：${p.genre || '未定'} ｜ 文风：${styleById(p.styleId).name} ｜ 导出：${new Date().toLocaleString('zh-CN',{hour12:false})}`, '');
  if(p.idea){ lines.push('## 核心灵感', '', p.idea, ''); }
  lines.push('## 世界观', '');
  WORLD_FIELDS.forEach(f => { if(p.world[f.key]) lines.push(`### ${f.label}`, '', p.world[f.key], ''); });
  lines.push('## 人物', '');
  p.characters.forEach(c => {
    lines.push(`### ${c.name}（${c.role}）`, '');
    CHAR_FIELDS.forEach(f => { if(c[f.key]) lines.push(`- **${f.label}**：${c[f.key]}`); });
    lines.push('');
  });
  if(p.relationships) lines.push('### 人物关系网', '', p.relationships, '');
  if(p.library && p.library.entries.length){
    lines.push('## 人物资料库', '');
    LIB_TYPES.forEach(t => {
      const list = p.library.entries.filter(e => e.type === t.key);
      if(!list.length) return;
      lines.push(`### ${t.label}`, '');
      list.forEach(e => {
        lines.push(`#### ${e.name}${e.aliases && e.aliases.length ? '（' + e.aliases.join(' / ') + '）' : ''}`, '');
        if(e.owner && e.type !== 'character') lines.push(`- **归属**：${e.owner}`);
        if(e.summary) lines.push(`- **摘要**：${e.summary}`);
        if(e.tags && e.tags.length) lines.push(`- **标签**：${e.tags.join('、')}`);
        if(e.details) lines.push('', e.details);
        lines.push('');
      });
    });
  }
  lines.push('## 大纲', '');
  if(p.outline.logline) lines.push(`**一句话故事**：${p.outline.logline}`, '');
  if(p.outline.mainline) lines.push('### 全书主线', '', p.outline.mainline, '');
  p.outline.volumes.forEach((v, i) => {
    lines.push(`### 第${i+1}卷 ${v.title}`, '');
    if(v.summary) lines.push(v.summary, '');
    v.chapters.forEach(ch => {
      lines.push(`- **${ch.title}**${ch.outline ? '：' + ch.outline : ''}`);
    });
    lines.push('');
  });
  const written = allChapters().filter(x => (x.ch.content || '').trim());
  if(written.length){
    lines.push('---', '', '## 正文', '');
    written.forEach(x => {
      lines.push(`### ${x.ch.title}`, '', x.ch.content.trim(), '');
    });
  }
  return lines.join('\n');
}

function setPath(obj, path, val){
  const parts = path.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}
function findVolume(id){ return proj().outline.volumes.find(v => v.id === id); }
function safeName(s){ return String(s || '未命名作品').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || '未命名作品'; }
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}
function newCharacter(){
  return { id:uid('c'), name:'新角色', role:'配角', identity:'', appearance:'', personality:'', motivation:'', secret:'', arc:'', relation:'', image:'', locked:false };
}
function demoNewCharacters(p, n=4){
  const base = demoCharacters(p, Math.max(4, n));
  const used = new Set(p.characters.map(c => c.name));
  return base.slice(0, n).map(c => {
    let nm = c.name, k = 2;
    while(used.has(nm)){ nm = c.name + '·' + k; k++; }
    used.add(nm);
    return Object.assign({}, c, { id:uid('c'), name:nm, locked:false });
  });
}
function mergeCharacter(c, data){
  CHAR_FIELDS.forEach(f => { if(typeof data[f.key] === 'string' && data[f.key].trim()) c[f.key] = data[f.key].trim(); });
}
function asExtracted(v){
  const s = asText(v).trim();
  return /^(未提及|未知|暂无|无|不适用|n\/a)$/i.test(s) ? '' : s;
}
function normalizeCharacterRole(value){
  const r = asText(value).trim();
  const roles = ['主角','女主','男主','对手','盟友','导师','配角','反派'];
  if(roles.includes(r)) return r;
  if(/女主|女一|女主角/.test(r)) return '女主';
  if(/男主|男一|男主角/.test(r)) return '男主';
  if(/反派/.test(r)) return '反派';
  if(/对手|敌人|宿敌/.test(r)) return '对手';
  if(/导师|师父|师尊|长辈/.test(r)) return '导师';
  if(/盟友|同伴|朋友/.test(r)) return '盟友';
  if(/主角|主人公/.test(r)) return '主角';
  if(/配角|路人/.test(r)) return '配角';
  return '';
}
function mergeExtractedCharacters(p, list){
  const result = { added:0, merged:0, locked:0 };
  if(!Array.isArray(p.characters)) p.characters = [];
  asArray(list).slice(0, 50).forEach(raw => {
    if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return;
    const name = asExtracted(raw.name).replace(/\s+/g, ' ').slice(0, 40);
    if(!name || name === '新角色' || name === '未命名') return;
    const clean = {};
    CHAR_FIELDS.forEach(f => { clean[f.key] = asExtracted(raw[f.key]).slice(0, 800); });
    const role = normalizeCharacterRole(raw.role);
    const same = p.characters.find(c => asText(c.name).trim() === name);
    if(same){
      if(same.locked){ result.locked++; return; }
      let changed = false;
      CHAR_FIELDS.forEach(f => {
        if(!asText(same[f.key]).trim() && clean[f.key]){ same[f.key] = clean[f.key]; changed = true; }
      });
      if(role && (!same.role || same.role === '配角' || same.role === '路人')){ same.role = role; changed = true; }
      if(changed) result.merged++;
    } else {
      if(p.characters.length >= 50) return;
      const c = newCharacter();
      c.name = name;
      c.role = role || '配角';
      CHAR_FIELDS.forEach(f => { if(clean[f.key]) c[f.key] = clean[f.key]; });
      p.characters.push(c);
      result.added++;
    }
  });
  return result;
}
function applyWorldExtract(p, data){
  if(!p.world || typeof p.world !== 'object') p.world = {};
  if(!p.world.locked || typeof p.world.locked !== 'object' || Array.isArray(p.world.locked)) p.world.locked = {};
  const labels = [];
  WORLD_FIELDS.forEach(f => {
    if(p.world.locked[f.key]) return;
    const val = asExtracted(data && data[f.key]).slice(0, 1200);
    if(!val) return;
    if(asText(p.world[f.key]).trim()) return;
    p.world[f.key] = val.slice(0, 1200);
    labels.push(f.label);
  });
  return labels;
}
